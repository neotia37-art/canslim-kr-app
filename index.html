const won = (n) => (n == null ? "—" : Math.round(n).toLocaleString("ko-KR"));
const pct = (n, d = 1) => (n == null ? "—" : `${(n * 100).toFixed(d)}%`);

function DistributionDots({ count, total = 25 }) {
  return (
    <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
      {Array.from({ length: total }).map((_, i) => (
        <span key={i} style={{ width: 6, height: 6, borderRadius: 1, background: i < count ? C.down : C.line }} />
      ))}
    </div>
  );
}

function ScoreBar({ score, tone }) {
  const s = Math.max(0, Math.min(100, score ?? 0));
  return (
    <div style={{ height: 4, background: C.line, borderRadius: 2, overflow: "hidden" }}>
      <div style={{ width: `${s}%`, height: "100%", background: tone, transition: "width .4s" }} />
    </div>
  );
}

function factorTone(s) {
  if (s == null || s < 0) return C.faint;
  if (s >= 80) return C.up;
  if (s >= 60) return C.pivot;
  return C.down;
}

function MarketGate({ ms, onChart }) {
  if (!ms) return null;
  const meta = STATE_KO[ms.state] || { label: ms.state, tone: C.dim, verb: "" };
  return (
    <div style={{ background: C.surface, borderTop: `3px solid ${meta.tone}`, padding: "18px 18px 16px" }}>
      <div style={{ fontSize: 11, letterSpacing: ".14em", color: C.faint, marginBottom: 6 }}>M · 시장 방향 (오닐 게이트)</div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12 }}>
        <div style={{ fontSize: 22, fontWeight: 700, color: meta.tone, letterSpacing: "-.02em" }}>{meta.label}</div>
        <div style={{ fontSize: 13, color: C.dim }}>{ms.index_name}</div>
      </div>
      <div style={{ marginTop: 4, fontSize: 14, color: C.text }}>{meta.verb}</div>
      <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <div>
          <div style={{ fontSize: 11, color: C.faint, marginBottom: 6 }}>분산일 {ms.distribution_days}개 / 25일</div>
          <DistributionDots count={ms.distribution_days} />
        </div>
        <div>
          <div style={{ fontSize: 11, color: C.faint, marginBottom: 4 }}>허용 투자비중</div>
          <div style={{ fontSize: 20, fontWeight: 700, color: C.text }}>{pct(ms.max_exposure, 0)}</div>
        </div>
      </div>
      <div style={{ marginTop: 14, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, fontSize: 11 }}>
        <div style={{ background: C.raised, borderRadius: 6, padding: "8px 10px" }}>
          <div style={{ color: C.faint }}>50일선</div>
          <div style={{ color: ms.above_ma50 ? C.up : C.down, fontWeight: 600 }}>{ms.above_ma50 ? "위" : "아래"}</div>
        </div>
        <div style={{ background: C.raised, borderRadius: 6, padding: "8px 10px" }}>
          <div style={{ color: C.faint }}>200일선</div>
          <div style={{ color: ms.above_ma200 ? C.up : C.down, fontWeight: 600 }}>{ms.above_ma200 ? "위" : "아래"}</div>
        </div>
        <div style={{ background: C.raised, borderRadius: 6, padding: "8px 10px" }}>
          <div style={{ color: C.faint }}>고점대비</div>
          <div style={{ color: C.down, fontWeight: 600 }}>{pct(ms.pct_from_high)}</div>
        </div>
      </div>
      {ms.ftd_date ? (
        <div style={{ marginTop: 12, fontSize: 12, color: C.dim }}>후속일(FTD) {ms.ftd_date} · +{pct(ms.ftd_gain, 2)} · {ms.days_since_ftd}일 경과</div>
      ) : (
        <div style={{ marginTop: 12, fontSize: 12, color: C.down }}>FTD(후속일) 미확인 — 반등 시도 후 확인일 대기 중</div>
      )}
      {(ms.commentary || []).map((c, i) => (
        <div key={i} style={{ marginTop: 6, fontSize: 12, color: C.dim, lineHeight: 1.5 }}>· {c}</div>
      ))}
      <button onClick={onChart} style={{ marginTop: 14, width: "100%", background: C.raised, border: `1px solid ${C.line}`, color: C.dim, borderRadius: 8, padding: "10px", fontSize: 13 }}>
        최근 가격·분산일 차트 보기
      </button>
    </div>

}

function StockRow({ s, onOpen, muted, onAddWatch }) {
  const plan = s.trade_plan || {};
  const base = s.base || {};
  const buyable = plan["상태"] === "매수 가능 구간";
  const rs = s.factors?.L?.detail?.["RS Rating"] ?? s.factors?.L?.detail?.["RS Rating (프록시)"];
  return (
    <div style={{ width: "100%", background: C.raised, border: `1px solid ${buyable && !muted ? C.up : C.line}`, borderRadius: 10, padding: 14, marginBottom: 10, opacity: muted ? 0.55 : 1, color: C.text }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }} onClick={() => onOpen(s)}>
        <div>
          <div style={{ fontSize: 16, fontWeight: 600 }}>{s.name}</div>
          <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>{s.code} · {s.market}</div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: factorTone(s.total_score) }}>{s.total_score ?? "—"}</div>
          <div style={{ fontSize: 11, color: C.faint }}>{s.grade}</div>
        </div>
      </div>
      <div style={{ display: "flex", gap: 4, marginTop: 12 }} onClick={() => onOpen(s)}>
        {["C","A","N","S","L","I"].map(k => {
          const f = s.factors?.[k];
          return (
            <div key={k} style={{ flex: 1 }}>
              <div style={{ fontSize: 9, color: C.faint, marginBottom: 3, textAlign: "center" }}>{k}</div>
              <ScoreBar score={f?.score} tone={factorTone(f?.score)} />
            </div>
          );
        })}
      </div>
      <div style={{ marginTop: 12, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }} onClick={() => onOpen(s)}>
        {rs != null && <span style={{ fontSize: 11, color: C.dim }}>RS {rs}</span>}
        {base.found && <span style={{ fontSize: 11, color: C.dim }}>{BASE_KO[base.pattern] || base.pattern} {base.weeks}주 · {base.stage}차</span>}
        <span style={{ marginLeft: "auto", fontSize: 11, fontWeight: 600, color: buyable ? C.up : C.dim, padding: "3px 8px", borderRadius: 4, background: buyable ? "rgba(229,72,77,.12)" : "transparent" }}>{plan["상태"] || "—"}</span>
      </div>
      {plan["피벗(매수기준가)"] && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.line}`, display: "flex", justifyContent: "space-between", fontSize: 12 }} onClick={() => onOpen(s)}>
          <span style={{ color: C.faint }}>현재 <b style={{ color: C.text }}>{won(plan["현재가"])}</b></span>
          <span style={{ color: C.faint }}>피벗 <b style={{ color: C.pivot }}>{won(plan["피벗(매수기준가)"])}</b></span>
          <span style={{ color: C.faint }}>손절 <b style={{ color: C.down }}>{won(plan["손절가"])}</b></span>
        </div>
      )}
      {onAddWatch && (
        <button onClick={(e) => { e.stopPropagation(); onAddWatch(s); }} style={{ marginTop: 10, width: "100%", background: "transparent", border: `1px solid ${C.line}`, color: C.dim, borderRadius: 6, padding: "7px", fontSize: 12 }}>관심목록에 추가</button>
      )}
    </div>
  );
}

  const plan = s.trade_plan || {};
  const base = s.base || {};
  const blocked = marketState === "MARKET_IN_CORRECTION";
  return (
    <div style={{ paddingBottom: 40 }}>
      <div style={{ padding: "14px 18px", borderBottom: `1px solid ${C.line}`, position: "sticky", top: 0, background: C.ink, zIndex: 5 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: C.dim, fontSize: 13, padding: 0 }}>← 목록</button>
      </div>
      <div style={{ padding: 18 }}>
        <div style={{ fontSize: 22, fontWeight: 700 }}>{s.name}</div>
        <div style={{ fontSize: 12, color: C.faint, marginTop: 3 }}>{s.code} · {s.market} · {s.date}</div>
        <div style={{ marginTop: 14, display: "flex", alignItems: "baseline", gap: 10 }}>
          <div style={{ fontSize: 38, fontWeight: 800, color: factorTone(s.total_score) }}>{s.total_score ?? "—"}</div>
          <div style={{ fontSize: 15, color: C.dim }}>{s.grade}</div>
        </div>
        <div style={{ fontSize: 13, color: C.text, marginTop: 4 }}>{s.verdict}</div>
      </div>
      <div style={{ padding: "0 18px" }}>
        {["C","A","N","S","L","I"].map(k => {
          const f = s.factors?.[k];
          if (!f) return null;
          const tone = factorTone(f.score);
          return (
            <div key={k} style={{ background: C.surface, borderRadius: 10, padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <div><span style={{ fontSize: 15, fontWeight: 700, color: tone }}>{k}</span><span style={{ fontSize: 13, color: C.dim, marginLeft: 8 }}>{FACTOR_KO[k]}</span></div>
                <span style={{ fontSize: 16, fontWeight: 700, color: tone }}>{Math.round(f.score)}</span>
              </div>
              <div style={{ marginTop: 8 }}><ScoreBar score={f.score} tone={tone} /></div>
              {Object.keys(f.detail || {}).length > 0 && (
                <div style={{ marginTop: 12, display: "grid", gap: 5 }}>
                  {Object.entries(f.detail).map(([dk, dv]) => (
                    <div key={dk} style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                      <span style={{ color: C.faint }}>{dk}</span>
                      <span style={{ color: C.text }}>{typeof dv === "number" && Math.abs(dv) < 10 && !Number.isInteger(dv) ? pct(dv, 1) : String(dv)}</span>
                    </div>
                  ))}
                </div>
              )}
              {(f.notes || []).map((n, i) => <div key={i} style={{ marginTop: 8, fontSize: 12, color: C.dim, lineHeight: 1.5 }}>· {n}</div>)}
            </div>
          );
        })}
      </div>
      <div style={{ padding: "8px 18px 0" }}>
        <div style={{ background: C.surface, borderRadius: 10, padding: 14 }}>
          <div style={{ fontSize: 11, letterSpacing: ".14em", color: C.faint, marginBottom: 10 }}>베이스 (오닐 차트 패턴)</div>
          {base.found ? (
            <>
              <div style={{ fontSize: 17, fontWeight: 700 }}>{BASE_KO[base.pattern] || base.pattern}</div>
              <div style={{ fontSize: 12, color: C.dim, marginTop: 4 }}>{base.weeks}주 · 깊이 {pct(base.depth)} · {base.stage}차 · {STATUS_KO[base.status] || base.status}</div>
              <div style={{ marginTop: 14, display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10 }}>
                {[["좌측 고점", base.left_high, C.dim], ["저점", base.low, C.down], ["피벗", base.pivot, C.pivot]].map(([l, v, col]) => (
                  <div key={l}><div style={{ fontSize: 10, color: C.faint }}>{l}</div><div style={{ fontSize: 15, fontWeight: 600, color: col }}>{won(v)}</div></div>
                ))}
              </div>
              {(base.notes || []).map((n, i) => <div key={i} style={{ marginTop: 10, fontSize: 12, color: C.pivot }}>· {n}</div>)}
            </>
          ) : <div style={{ fontSize: 13, color: C.dim }}>유효 베이스 없음 — 매수 기준가 정의 불가</div>}
        </div>
      </div>
      <div style={{ padding: "10px 18px 0" }}>
        <div style={{ background: C.surface, borderRadius: 10, padding: 14, border: blocked ? `1px solid ${C.down}` : "none" }}>
          <div style={{ fontSize: 11, letterSpacing: ".14em", color: C.faint, marginBottom: 10 }}>매매 계획</div>
          <div style={{ fontSize: 17, fontWeight: 700, color: blocked ? C.down : C.text }}>{blocked ? "신규 매수 금지" : plan["상태"]}</div>
          <div style={{ fontSize: 12, color: C.dim, marginTop: 5, lineHeight: 1.55 }}>{blocked ? "시장이 조정 국면입니다. 오닐 규칙상 신규 진입을 하지 않습니다." : plan["사유"]}</div>
          {plan["피벗(매수기준가)"] && !blocked && (
            <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {[["매수 구간", `${won(plan["매수구간"]?.[0])} ~ ${won(plan["매수구간"]?.[1])}`, C.pivot], ["손절가", won(plan["손절가"]), C.down], ["1차 목표", won(plan["1차 목표"]), C.up], ["손익비", plan["손익비"], C.text]].map(([l, v, col]) => (
                <div key={l}><div style={{ fontSize: 10, color: C.faint }}>{l}</div><div style={{ fontSize: 14, fontWeight: 600, color: col, marginTop: 2 }}>{v ?? "—"}</div></div>
              ))}
            </div>
          )}
        </div>
      </div>
      {(s.warnings || []).length > 0 && (
        <div style={{ padding: "10px 18px 0" }}>
          <div style={{ background: "rgba(76,134,240,.08)", border: `1px solid ${C.down}`, borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 11, letterSpacing: ".14em", color: C.down, marginBottom: 8 }}>주의</div>
            {s.warnings.map((w, i) => <div key={i} style={{ fontSize: 12, color: C.text, marginBottom: 5 }}>· {w}</div>)}
          </div>
        </div>
      )}
    </div>
  );
}

function PriceChart({ ms, onClose }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || !ms?.recent_closes) return;
    const labels = ms.recent_closes.map(r => r.d);
    const closes = ms.recent_closes.map(r => r.c);
    const ch = ms.recent_closes.map(r => r.ch);
    const chart = new Chart(canvasRef.current, {
      type: 'line',
      data: { labels, datasets: [{ label: 'KOSPI', data: closes, borderColor: C.pivot, backgroundColor: 'rgba(242,193,78,0.1)', fill: true, tension: 0.2, pointRadius: 3, pointBackgroundColor: ch.map(c => c >= 0 ? C.up : C.down) }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: C.faint, maxRotation: 45 }, grid: { color: C.line } }, y: { ticks: { color: C.faint }, grid: { color: C.line } } } }
    });
    return () => chart.destroy();
  }, [ms]);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 100, display: "flex", alignItems: "flex-end" }}>
      <div style={{ background: C.ink, width: "100%", maxWidth: 480, margin: "0 auto", borderRadius: "16px 16px 0 0", padding: 18, maxHeight: "80vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>KOSPI 최근 흐름 & 분산일</div>
          <button onClick={onClose} style={{ background: C.raised, border: "none", color: C.dim, borderRadius: 6, padding: "6px 12px" }}>닫기</button>
        </div>
        <canvas ref={canvasRef} height="180"></canvas>
        <div style={{ marginTop: 16, fontSize: 12, color: C.dim, lineHeight: 1.6 }}>
          <b style={{ color: C.text }}>오닐 방식 해석</b><br/>
          · 7월 말 급락 후 7/31 +17.9% 대량 반등일은 강력한 반등 시도였으나, 이후 분산일이 추가되면서 FTD로 확정되지 않음.<br/>
          · 8/7, 8/18 분산일 누적으로 현재 7개 — 조정 국면 유지.<br/>
          · 50일선 하회, 고점 대비 -24.6%. 200일선 위 유지는 중기 상승 구조가 아직 붕괴되지 않았음을 시사.<br/>
          · 오닐 규칙: 분산일 5~6개 이상이면 신규 매수 중단. 현재 7개로 게이트 완전 폐쇄.
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(LIVE_DATA);
  const [tab, setTab] = useState("market");
  const [sel, setSel] = useState(null);
  const [watch, setWatch] = useState(() => { try { return JSON.parse(localStorage.getItem("canslim_watch") || "[]"); } catch { return []; } });
  const [showChart, setShowChart] = useState(false);
  const [searchCode, setSearchCode] = useState("");
  const [searchResult, setSearchResult] = useState(null);
  const [pasteMode, setPasteMode] = useState(false);
  const [rawJson, setRawJson] = useState("");
  const [err, setErr] = useState("");

  const ms = useMemo(() => { const m = data.시장판정 || {}; return m.KOSPI || m.KOSDAQ || Object.values(m)[0]; }, [data]);
  const blocked = ms?.state === "MARKET_IN_CORRECTION";

  useEffect(() => { localStorage.setItem("canslim_watch", JSON.stringify(watch)); }, [watch]);

  const addWatch = (s) => { if (watch.find(w => w.code === s.code)) return; setWatch([...watch, { code: s.code, name: s.name, market: s.market, added: new Date().toISOString().slice(0,10) }]); };
  const removeWatch = (code) => setWatch(watch.filter(w => w.code !== code));

  const doSearch = () => {
    const code = searchCode.trim().padStart(6, "0");
    const found = (data.종목 || []).find(s => s.code === code);
    if (found) setSearchResult(found);
    else setSearchResult({ code, name: `종목 ${code}`, market: "—", total_score: null, grade: "—", verdict: "실시간 분석 미구현 (서버/DART 필요)", factors: {}, base: { found: false }, trade_plan: { "상태": "데이터 부족", "사유": "이 앱은 클라이언트 전용입니다. DART API 키와 가격 데이터 수집은 서버 사이드에서 수행해야 합니다." }, warnings: ["전체 CANSLIM 분석을 위해서는 Python 백엔드 + DART + 가격 데이터가 필요합니다."] });
  };

  const loadJson = () => {
    try {
      const j = JSON.parse(rawJson);
      if (!j.종목) throw new Error("종목 배열이 없습니다");
      setData(j); setPasteMode(false); setRawJson(""); setErr(""); setSel(null);
    } catch (e) { setErr(`읽을 수 없습니다: ${e.message}`); }
  };

  if (sel) return (
    <div style={{ background: C.ink, color: C.text, minHeight: "100vh", maxWidth: 480, margin: "0 auto" }}>
      <Detail s={sel} onBack={() => setSel(null)} marketState={ms?.state} />
    </div>
  );

  return (
    <div style={{ background: C.ink, color: C.text, minHeight: "100vh", maxWidth: 480, margin: "0 auto" }} className="content">
      <div style={{ padding: "16px 18px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: "calc(16px + var(--safe-top))" }}>
        <div>
          <div style={{ fontSize: 17, fontWeight: 800, letterSpacing: "-.02em" }}>CANSLIM 한국</div>
          <div style={{ fontSize: 11, color: C.faint, marginTop: 2 }}>{data.기준일} · 유니버스 {won(data.유니버스)} · RS통과 {won(data.RS통과)}</div>
        </div>
        <button onClick={() => setPasteMode(!pasteMode)} style={{ background: C.raised, border: `1px solid ${C.line}`, color: C.dim, borderRadius: 6, padding: "7px 11px", fontSize: 12 }}>JSON</button>
      </div>

      {pasteMode && (
        <div style={{ padding: "0 18px 14px" }}>
          <textarea value={rawJson} onChange={e => setRawJson(e.target.value)} placeholder="canslim_result.json 붙여넣기" style={{ width: "100%", height: 100, background: C.surface, color: C.text, border: `1px solid ${C.line}`, borderRadius: 8, padding: 10, fontSize: 11, fontFamily: "monospace" }} />
          {err && <div style={{ color: C.down, fontSize: 12, marginTop: 6 }}>{err}</div>}
          <button onClick={loadJson} style={{ marginTop: 8, width: "100%", background: C.up, border: "none", color: "#fff", borderRadius: 8, padding: "11px", fontSize: 14, fontWeight: 600 }}>불러오기</button>
        </div>
      )}

      {tab === "market" && (
        <>
          <MarketGate ms={ms} onChart={() => setShowChart(true)} />
          <div style={{ padding: "16px 18px 8px" }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>후보 종목 (시장 게이트 적용)</div>
            {blocked && <div style={{ background: "rgba(76,134,240,.1)", border: `1px solid ${C.down}`, borderRadius: 8, padding: 12, marginBottom: 12, fontSize: 12, color: C.text, lineHeight: 1.5 }}>시장이 조정 국면이라 아래 후보는 관찰용입니다. 오닐 규칙상 신규 매수는 하지 않습니다.</div>}
            {(data.종목 || []).map(s => <StockRow key={s.code} s={s} onOpen={setSel} muted={blocked} onAddWatch={addWatch} />)}
          </div>
        </>
      )}

      {tab === "watch" && (
        <div style={{ padding: "12px 18px 40px" }}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>관심 목록 ({watch.length})</div>
          {watch.length === 0 ? (
            <div style={{ textAlign: "center", color: C.faint, padding: "40px 0", fontSize: 13 }}>관심 종목이 없습니다.<br/>시장 탭에서 추가하세요.</div>
          ) : watch.map(w => {
            const full = (data.종목 || []).find(s => s.code === w.code);
            return (
              <div key={w.code} style={{ background: C.raised, borderRadius: 10, padding: 14, marginBottom: 10, border: `1px solid ${C.line}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div><div style={{ fontSize: 16, fontWeight: 600 }}>{w.name}</div><div style={{ fontSize: 11, color: C.faint }}>{w.code} · 추가 {w.added}</div></div>
                  <button onClick={() => removeWatch(w.code)} style={{ background: "none", border: "none", color: C.down, fontSize: 13 }}>삭제</button>
                </div>
                {full && <div style={{ marginTop: 10 }}><StockRow s={full} onOpen={setSel} muted={blocked} /></div>}
                {!full && <div style={{ marginTop: 8, fontSize: 12, color: C.dim }}>상세 데이터 없음 — 분석 탭에서 코드 입력</div>}
              </div>
            );
          })}
        </div>
      )}

      {tab === "analyze" && (
        <div style={{ padding: "12px 18px 40px" }}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>종목 분석</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <input value={searchCode} onChange={e => setSearchCode(e.target.value)} placeholder="종목코드 6자리 (예: 005930)" style={{ flex: 1, background: C.surface, border: `1px solid ${C.line}`, borderRadius: 8, padding: "12px 14px", color: C.text, fontSize: 15 }} inputMode="numeric" />
            <button onClick={doSearch} style={{ background: C.up, border: "none", color: "#fff", borderRadius: 8, padding: "0 18px", fontWeight: 600 }}>분석</button>
          </div>
          {searchResult && (
            <div>
              <StockRow s={searchResult} onOpen={setSel} muted={false} onAddWatch={addWatch} />
              {searchResult.total_score == null && (
                <div style={{ marginTop: 12, background: C.surface, borderRadius: 10, padding: 14, fontSize: 12, color: C.dim, lineHeight: 1.6 }}>
                  <b style={{ color: C.text }}>실시간 전체 분석 안내</b><br/>
                  이 HTML 앱은 모바일 프론트엔드입니다. C/A 실적·기관수급·정확한 베이스 탐지는 Open DART API + FinanceDataReader + 서버 사이드 Python 엔진이 필요합니다. 관심목록에 추가 후 엔진 결과를 JSON으로 불러오면 상세 분석이 표시됩니다.
                </div>
              )}
            </div>
          )}
          <div style={{ marginTop: 24, fontSize: 12, color: C.faint, lineHeight: 1.55 }}>
            <b style={{ color: C.dim }}>오닐 분석 체크리스트</b><br/>
            C ≥ 25% 분기 이익 증가 + 가속<br/>
            A ≥ 25% 연간 이익 + ROE 17%+<br/>
            N 신제품·신고가·베이스 후반<br/>
            S 대량 거래 동반 돌파<br/>
            L RS Rating 80+ (주도주)<br/>
            I 기관·외국인 순매수<br/>
            M 시장 게이트 (가장 중요)
          </div>
        </div>
      )}

      {tab === "backtest" && (
        <div style={{ padding: "12px 18px 40px" }}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 8 }}>임계값 백테스트 (2015~2025)</div>
          <div style={{ fontSize: 12, color: C.dim, lineHeight: 1.55, marginBottom: 16 }}>
            현재 사용 중인 CANSLIM 임계값(RS≥80, C≥25%, 베이스 깊이 ≤33% 등)은 오닐 원본(미국 시장)에서 유도된 값입니다. 한국 시장 특성에 맞게 2015~2025년 일별 데이터로 실증 최적화하는 모듈이 필요합니다.
          </div>
          <div style={{ background: C.surface, borderRadius: 10, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>최적화 대상 파라미터</div>
            <div style={{ fontSize: 12, color: C.dim, lineHeight: 1.7 }}>
              · RS Rating 최소 컷오프 (현재 80)<br/>
              · 분기 이익 증가율 최소 (현재 25%)<br/>
              · 베이스 최대 허용 깊이 (현재 33~35%)<br/>
              · 분산일 게이트 임계 (현재 5~6개)<br/>
              · 피벗 돌파 후 최대 추격 % (현재 5%)<br/>
              · 손절 폭 (현재 7~8%)
            </div>
          </div>
          <div style={{ background: C.surface, borderRadius: 10, padding: 14, marginBottom: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>백테스트 프레임워크 (Python)</div>
            <div style={{ fontSize: 11, color: C.faint, fontFamily: "monospace", background: C.ink, padding: 10, borderRadius: 6, overflowX: "auto", whiteSpace: "pre-wrap" }}>
{`# backtest_canslim_kr.py 골격
import FinanceDataReader as fdr
from OpenDartReader import OpenDartReader
dart = OpenDartReader("YOUR_KEY")

# 1. 2015-01 ~ 2025-12 KOSPI/KOSDAQ 일봉 + 거래량
# 2. 매 분기 실적 스냅샷 (DART)
# 3. 매일 시장 상태(M) 판정 → 분산일/FTD
# 4. RS, 베이스 탐지, 돌파 시그널 생성
# 5. 파라미터 그리드 서치 → Sharpe / MDD / 승률 최적화
# 6. 워크포워드 검증으로 과적합 방지`}
            </div>
          </div>
          <div style={{ background: "rgba(242,193,78,.08)", border: `1px solid ${C.pivot}`, borderRadius: 10, padding: 14, fontSize: 12, color: C.text, lineHeight: 1.55 }}>
            <b style={{ color: C.pivot }}>다음 단계</b><br/>
            이 저장소에 backtest/ 폴더와 Python 모듈을 추가할 예정입니다. 결과가 나오면 이 앱의 임계값이 자동으로 업데이트되고, 시장 게이트·종목 점수가 한국 실증값으로 교체됩니다.
          </div>
        </div>
      )}

      <div className="tabbar">
        {[
          { id: "market", label: "시장", icon: "📈" },
          { id: "watch", label: "관심", icon: "★" },
          { id: "analyze", label: "분석", icon: "🔍" },
          { id: "backtest", label: "백테스트", icon: "⚙" },
        ].map(t => (
          <button key={t.id} className={tab === t.id ? "active" : ""} onClick={() => { setTab(t.id); setSel(null); }}>
            <span className="icon">{t.icon}</span>{t.label}
          </button>
        ))}
      </div>

      {showChart && <PriceChart ms={ms} onClose={() => setShowChart(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
